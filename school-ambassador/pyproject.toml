[project]
name = "school-ambassador"
version = "0.1.0"
description = "AI School Ambassador - Offline voice-interactive kiosk pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "kokoro-onnx>=0.3.0",
    "soundfile>=0.12.0",
    "sherpa-onnx>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
